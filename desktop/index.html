<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sail Analyzer</title>
  </head>
  <body>
    <header>
      <div class="bar">
        <button id="open">파일 열기</button>
        <button id="sample">시험용 데이터</button>
        <span class="sep"></span>
        <button id="openVideo">영상 열기</button>
        <span class="sep"></span>
        <button id="fit">전체 보기</button>
        <button id="addMark" title="파란 고정선 자리에 깃발을 답니다">＋ 마킹</button>
        <span id="range" class="dim"></span>
        <span style="flex:1"></span>
      </div>
      <div id="meta"></div>
      <div id="status"></div>
      <div id="prog"><div id="progBar"></div><span id="progText"></span></div>
    </header>

    <main>
      <aside id="left">
        <div class="tabs">
          <button id="tabLib" class="tab on">보관함</button>
          <button id="tabBoard" class="tab">보드</button>
        </div>
        <div id="libBar" class="subbar">
          <input id="q" placeholder="선수 · 장소 · 메모 찾기" spellcheck="false" />
        </div>
        <div id="boardBar" class="subbar" style="display:none">
          <input id="host" value="192.168.4.1" spellcheck="false" />
          <button id="list">목록</button>
        </div>
        <div id="files"></div>
      </aside>

      <!-- 가운데를 좌우 반반으로 — 왼쪽 영상, 오른쪽 데이터 -->
      <section id="center">
        <div id="videoPane">
          <div class="vwrap">
            <video id="vid" playsinline></video>
            <div id="vdrop">
              <div>
                <b>영상을 여기에 끌어다 놓으세요</b><br />
                <span class="dim">MP4 / MOV · 고프로 · DJI</span>
              </div>
            </div>
          </div>
          <!-- 영상 스크러빙 슬라이더. 타임라인 없이도 영상만 훑을 수 있어야 한다 -->
          <div id="vseek">
            <input id="vslider" type="range" min="0" max="1000" value="0" step="1" />
          </div>
          <div id="vbar">
            <button id="play">▶</button>
            <span id="vtime" class="mono dim">0:00 / 0:00</span>
            <span class="sep"></span>
            <button id="syncBtn" title="지금 영상 화면과 타임라인 자리를 맞춰 물린다. 다시 누르면 푼다">싱크</button>
            <button id="n10">−10초</button>
            <button id="n1">−1초</button>
            <button id="p1">+1초</button>
            <button id="p10">+10초</button>
            <span id="voff" class="mono dim"></span>
          </div>
        </div>
        <div id="mapPane">
          <div id="map"></div>
          <div id="mapBar">
            <select id="baseSel" title="바탕 지도"></select>
            <label><input id="seamark" type="checkbox" /> 해도 표시</label>
            <label><input id="bySog" type="checkbox" checked /> 속도로 색칠</label>
            <button id="mapFit" title="항적 전체가 보이게">항적 맞춤</button>
          </div>
          <div id="mapNone" class="dim">위치가 없는 세션입니다.</div>
        </div>
        <div id="split"></div>
        <div id="dataPane">
          <canvas id="plot"></canvas>
          <div id="readout"></div>
        </div>
      </section>

      <aside id="right">
        <div id="details"></div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
