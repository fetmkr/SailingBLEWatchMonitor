<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      손가락 두 개로 화면 전체를 키우는 것을 막는다.

      아이패드에서 화면을 만드는 wry 는 확대에 아무것도 안 한다. 소스를
      읽어 보면 튕김만 끈다 (wkwebview/mod.rs 528줄의 setBounces(false)).
      확대를 끄는 설정은 있는데 윈도우 전용이다. 그러니 확대를 정하는 건
      이 한 줄뿐이다.

      ★ "요즘 iOS 는 user-scalable 을 무시한다" 는 이야기는 사파리 이야기다.
        앱 안의 화면(WKWebView)은 그대로 따른다. 웹킷 쪽에서 직접 밝혔다.
        [확인: https://webkit.org/blog/7367/new-interaction-behaviors-in-ios-10/]

      ★ 대신 치르는 값이 있다. 눈이 어두운 사람이 화면을 키워 볼 수 없게
        된다. 접근성 기준(WCAG 2.1 1.4.4)에 어긋난다. 배 위에서 젖은 손으로
        만지다 화면이 통째로 커지면 돌아올 방법이 마땅치 않아서 이쪽을
        골랐다. 그래프와 지도는 앱 안에 따로 키우는 방법이 있다.

      viewport-fit=cover 는 모서리가 둥근 아이패드에서 바탕색이 끝까지 차게 한다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
                                   maximum-scale=1.0, user-scalable=no,
                                   viewport-fit=cover" />
    <title>Sail Analyzer</title>
  </head>
  <body>
    <!--
      화면을 사방으로 나눈다. Saleae Logic 2 가 하는 방식이다.

        위     시키는 것 — 단추만 한 줄
        가운데  보는 것 — 영상·지도(위) / 데이터(아래)
        오른쪽  지금 것의 속성 — 서랍 하나를 아이콘으로 갈아 끼운다
        아래    지금 상태 — 한 줄

      왼쪽에는 서랍을 두지 않는다. 그 자리는 타임라인의 이름 칸이 쓴다.
      양옆에 서랍을 두면 가운데가 양쪽에서 깎이는데, 타임라인은 너비가
      생명이다.
    -->
    <header id="topbar">
      <!--
        매번 하는 일만 둔다. 가끔 만지는 것은 설정 서랍(⚙)으로 보냈다 —
        시험용 데이터, 가운데 배치, 디버그 값.
        "전체 보기" 는 데이터 칸 제 손잡이로, "넓게" 는 아이콘을 한 번 더
        누르면 되니 없앴다.
      -->
      <button id="open">데이터 열기</button>
      <button id="openVideo">영상 열기</button>
      <span class="sep"></span>
      <button id="addMark" title="파란 고정선 자리에 깃발을 답니다">＋ 마킹</button>
      <span id="range" class="dim mono"></span>
      <span style="flex: 1"></span>
      <span id="fileTag" class="dim"></span>
    </header>

    <main id="shell">
      <section id="center">
        <div id="mediaRow">
          <div id="videoPane">
            <div class="vwrap">
              <video id="vid" playsinline></video>
              <div id="vdrop">
                <div>
                  <b>영상을 여기에 끌어다 놓으세요</b><br />
                  <span class="dim">MP4 / MOV · 고프로 · DJI</span>
                </div>
              </div>
            </div>
            <!-- 영상 스크러빙 슬라이더. 타임라인 없이도 영상만 훑을 수 있어야 한다 -->
            <div id="vseek">
              <input id="vslider" type="range" min="0" max="1000" value="0" step="1" />
            </div>
            <div id="vbar">
              <span id="vtime" class="mono dim">0:00 / 0:00</span>
              <button id="syncBtn" title="지금 영상 화면과 타임라인 자리를 맞춰 물린다. 다시 누르면 푼다">싱크</button>
              <!-- 넷은 한 덩어리다. 줄이 좁아지면 넷이 같이 아래로 내려간다.
                   따로 흩어지면 "+10초" 만 혼자 떨어져서 깨져 보인다. -->
              <span class="grp">
                <button id="n10">−10초</button>
                <button id="n1">−1초</button>
                <button id="p1">+1초</button>
                <button id="p10">+10초</button>
              </span>
              <span id="voff" class="mono dim"></span>
            </div>
          </div>
          <div id="mapPane">
            <div id="map"></div>
            <div id="mapBar">
              <select id="baseSel" title="바탕 지도"></select>
              <label><input id="seamark" type="checkbox" /> 해도</label>
              <label><input id="bySog" type="checkbox" checked /> 속도 색칠</label>
              <button id="mapFit" title="항적 전체가 보이게">항적 맞춤</button>
            </div>
            <div id="mapNone" class="dim">위치가 없는 세션입니다.</div>
          </div>
        </div>
        <div id="dataPane">
          <canvas id="plot"></canvas>
        </div>
      </section>

      <!-- 서랍. 한 번에 하나만 열린다. -->
      <aside id="dock">
        <div class="drawer" data-tab="board" hidden>
          <div class="dhead">보드</div>
          <div class="subbar">
            <button id="btScan">배 찾기</button>
            <button id="btDrop" class="ghost" style="display: none"
                    title="보드 WiFi 를 끄고 블루투스로 돌아갑니다">연결 해제</button>
            <span style="flex: 1"></span>
            <button id="byHand" class="ghost" title="주소를 직접 치겠다">주소로</button>
          </div>
          <div id="hostBar" class="subbar" style="display: none">
            <input id="host" value="192.168.4.1" spellcheck="false" />
            <button id="list">목록</button>
          </div>
          <div id="boards"></div>
          <div id="boardFiles"></div>
        </div>

        <div class="drawer" data-tab="lib">
          <div class="dhead">세션</div>
          <div class="subbar">
            <input id="q" placeholder="선수 · 장소 · 메모 찾기" spellcheck="false" />
          </div>
          <!--
            목록과 그 세션의 정보를 한 서랍에 둔다. 정보는 "지금 연 세션의
            속성" 이라 목록과 떼어 놓을 이유가 없었다. 연 세션의 줄이
            그 자리에서 펼쳐진다.
          -->
          <div id="files"></div>
        </div>

        <div class="drawer" data-tab="mark" hidden>
          <div class="dhead">마킹</div>
          <div id="markList"></div>
        </div>

        <div class="drawer" data-tab="set" hidden>
          <div class="dhead">설정</div>
          <div class="srow"><span>화면</span></div>
          <div class="segv" id="themeSeg">
            <button data-theme="ink"><b>잉크</b><span>중립 검정 · 로고 파랑을 점으로</span></button>
            <button data-theme="sea"><b>심해</b><span>남색 어둠 · 요트 계기 쪽</span></button>
            <button data-theme="paper"><b>종이</b><span>밝은 쪽 · 햇빛 아래서</span></button>
            <button data-theme="electric"><b>전기</b><span>파랑을 면으로</span></button>
            <button data-theme="vivid"><b>계기판</b><span>새까만 바탕 · 선마다 쨍한 색</span></button>
            <button data-theme="auto"><b>맥 따라</b><span>밝으면 종이, 어두우면 방금 고른 어두운 판</span></button>
          </div>

          <div class="srow" style="margin-top:14px">
            <span>배치</span>
            <button id="resetLayout" class="ghost">처음 배치로 되돌리기</button>
          </div>
          <div class="srow" style="margin-top:14px">
            <span>시험</span>
            <button id="sample" class="ghost">시험용 데이터 열기</button>
          </div>
          <div class="srow" style="margin-top:14px">
            <span>가운데</span>
            <div class="seg" id="dirSeg">
              <button data-dir="col">⇅ 위아래</button>
              <button data-dir="row">⇄ 좌우</button>
            </div>
          </div>

          <div class="srow" style="margin-top:14px">
            <span>값</span>
            <label class="chk"><input id="dbgRows" type="checkbox" />
              디버그 값 보기</label>
          </div>
          <div class="dim" style="font-size:12px; margin: -2px 0 0 54px">
            자력계 · 위성 수 · 위치 정확도 · 배터리
          </div>

        </div>
      </aside>

      <!-- 아이콘 줄. 늘 보인다 — 무엇이 있는지 알아야 하니까. -->
      <nav id="rail">
        <!-- 일하는 순서대로 — 보드에서 받아, 세션을 열고, 마킹을 본다 -->
        <button class="rbtn"    data-tab="board" title="보드"><span>◈</span>보드</button>
        <button class="rbtn on" data-tab="lib"   title="세션"><span>▤</span>세션</button>
        <button class="rbtn"    data-tab="mark"  title="마킹"><span>⚑</span>마킹</button>
        <span style="flex: 1"></span>
        <button class="rbtn"    data-tab="set"   title="설정"><span>⚙</span>설정</button>
      </nav>
    </main>

    <!--
      시간 막대.

      영상·지도·그래프가 다 같은 시간을 본다. 그래서 재생 단추가 영상 칸
      안에 있으면 안 된다. 영상을 접으면 같이 사라졌다.

      여기 있는 것은 "지금 몇 초를 보고 있나" 뿐이다. 영상이 얼마나
      어긋났는지 맞추는 단추들은 영상 칸에 남겼다. 그건 영상이 있을 때만
      뜻이 있다.
    -->
    <div id="transport">
      <button id="play" title="재생 · 멈춤">▶</button>
      <span id="ttime" class="mono dim">0:00 / 0:00</span>
      <input id="tslider" type="range" min="0" max="1000" value="0" step="1"
             title="시간 옮기기" />
    </div>

    <footer id="statusbar">
      <span id="readout" class="mono"></span>
      <span style="flex: 1"></span>
      <span id="prog"><span id="progBar"></span><span id="progText"></span></span>
      <span id="status"></span>
      <span id="boardTag" class="dim"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
