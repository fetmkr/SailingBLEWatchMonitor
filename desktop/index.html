<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sail Analyzer</title>
  </head>
  <body>
    <header>
      <div class="bar">
        <button id="open">파일 열기</button>
        <button id="sample">시험용 데이터</button>
        <span class="sep"></span>
        <button id="openVideo">영상 열기</button>
        <span class="sep"></span>
        <button id="fit">전체 보기</button>
        <span id="range" class="dim"></span>
        <span style="flex:1"></span>
      </div>
      <div id="meta"></div>
      <div id="status"></div>
    </header>

    <main>
      <aside id="left">
        <div class="tabs">
          <button id="tabLib" class="tab on">보관함</button>
          <button id="tabBoard" class="tab">보드</button>
        </div>
        <div id="libBar" class="subbar">
          <input id="q" placeholder="선수 · 장소 · 메모 찾기" spellcheck="false" />
        </div>
        <div id="boardBar" class="subbar" style="display:none">
          <input id="host" value="192.168.4.1" spellcheck="false" />
          <button id="list">목록</button>
        </div>
        <div id="files"></div>
      </aside>

      <!-- 가운데를 좌우 반반으로 — 왼쪽 영상, 오른쪽 데이터 -->
      <section id="center">
        <div id="videoPane">
          <div class="vwrap">
            <video id="vid" playsinline></video>
            <div id="vdrop">
              <div>
                <b>영상을 여기에 끌어다 놓으세요</b><br />
                <span class="dim">MP4 / MOV · 고프로 · DJI</span>
              </div>
            </div>
          </div>
          <div id="vbar">
            <button id="play">▶</button>
            <span id="vtime" class="mono dim">0:00</span>
            <span class="sep"></span>
            <span class="dim">싱크</span>
            <button id="syncHere" title="지금 보이는 영상 화면이 타임라인 커서 자리라고 알려 준다">여기 맞춤</button>
            <button id="n10">−10초</button>
            <button id="n1">−1초</button>
            <button id="p1">+1초</button>
            <button id="p10">+10초</button>
            <span id="voff" class="mono dim"></span>
          </div>
        </div>
        <div id="split"></div>
        <div id="dataPane">
          <canvas id="plot"></canvas>
          <div id="readout"></div>
        </div>
      </section>

      <aside id="right">
        <div id="details"></div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
