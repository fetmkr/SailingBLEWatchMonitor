[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.9"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-blec = "0.12.0"

# USB 시리얼은 아이패드에서 못 쓴다. 부품이 iOS 에서는 serialport 를 아예
# 빼도록 되어 있다 (tauri-plugin-serialplugin 의 Cargo.toml 85번 줄).
# 넣어 봐야 아무것도 못 하니 부품 자체를 안 넣는다.
# 이 조건은 src/lib.rs 의 cfg 조건과 늘 같아야 한다.
[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-serialplugin = "3.0.2"
