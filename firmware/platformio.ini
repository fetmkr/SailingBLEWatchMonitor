; Sailing Monitor — 요트 텔레메트리 BLE 테스트 펌웨어
;
;   pio run                    기본 보드(Feather TFT) 빌드
;   pio run -t upload          플래시
;   pio run -e devkit_s3       TFT 없는 일반 ESP32-S3 DevKit 용

[platformio]
default_envs = feather_s3_tft

[env]
platform  = espressif32
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	h2zero/NimBLE-Arduino @ ^2.5.1

build_flags =
	-DCORE_DEBUG_LEVEL=1


; ── Adafruit ESP32-S3 TFT Feather (기본) ─────────────────────────────────
; https://learn.adafruit.com/adafruit-esp32-s3-tft-feather
; 240x135 ST7789 내장. USB CDC 는 보드 정의에 이미 켜져 있어 따로 설정할 필요 없다.
[env:feather_s3_tft]
board = adafruit_feather_esp32s3_tft
upload_speed = 460800

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
	adafruit/Adafruit GFX Library @ ^1.12.0

build_flags =
	${env.build_flags}
	-DSAIL_HAS_TFT=1


; ── 일반 ESP32-S3 DevKitC-1 (화면 없음) ──────────────────────────────────
[env:devkit_s3]
board = esp32-s3-devkitc-1
upload_speed = 921600

build_flags =
	${env.build_flags}
	-DSAIL_HAS_TFT=0
	; USB-OTG 포트만 있는 보드에서 시리얼 로그를 보려면 아래 두 줄 주석 해제
	; -DARDUINO_USB_CDC_ON_BOOT=1
	; -DARDUINO_USB_MODE=1
