; HOHO-01 요트 텔레메트리 BLE 테스트 펌웨어
; 보드: ESP32-S3 DevKitC-1 (N16R8 등 대부분의 S3 DevKit 호환)

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
	h2zero/NimBLE-Arduino @ ^2.5.1

build_flags =
	-DCORE_DEBUG_LEVEL=1
	; USB CDC 로 시리얼 모니터를 쓰려면(보드에 UART 브리지가 없는 경우) 아래 두 줄 주석 해제
	; -DARDUINO_USB_CDC_ON_BOOT=1
	; -DARDUINO_USB_MODE=1
