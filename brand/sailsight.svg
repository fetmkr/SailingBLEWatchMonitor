    <path d="M202 158 V202 H158" stroke-linecap="square"/>
    <path d="M84 202 H40 V158"   stroke-linecap="square"/>
    <path d="M140 68 V174"       stroke-linecap="butt"/>
    <path d="M140 68 L90 174"    stroke-linecap="butt" stroke-dasharray="33.1 9"/>
  </g>
</svg>
