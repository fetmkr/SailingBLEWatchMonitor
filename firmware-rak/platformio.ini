; Sailing Monitor — RAK3112 (ESP32-S3) + RAK19007 베이스보드 펌웨어
;
;   pio run                 빌드
;   pio run -t upload       플래시
;   pio device monitor      시리얼 (115200)
;
; firmware/ (Adafruit Feather TFT) 와는 완전히 분리된 프로젝트다.
; protocol.h / simulator.h 는 각자 자기 사본을 갖는다.
; ★ 프로토콜을 고칠 때는 세 곳을 함께 고쳐야 한다:
;     firmware/include/protocol.h
;     firmware-rak/include/protocol.h
;     app/Shared/Protocol.swift

[platformio]
default_envs = rak3112

; RAK 이 배포하는 보드 정의를 저장소 안에 넣어 두고 쓴다.
;   출처: github.com/RAKWireless/WisBlock
;         examples/RAK3112/IDE-Patches/PlatformIO/rakwireless/
;         커밋 ae4137bb (2026-07-23)
boards_dir = rakwireless/boards


[env:rak3112]
platform  = platformio/espressif32
board     = rak3112
framework = arduino

; 16 MB 플래시. 보드 정의가 qio_opi + PSRAM 을 이미 켜 놓는다.
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	h2zero/NimBLE-Arduino @ ^2.5.1
	; GPS(RAK12501 / L76K) NMEA 파싱
	mikalhart/TinyGPSPlus @ ^1.1.0
	; IMU(RAK1905 / MPU-9250) 9축. RAK 공식 예제가 쓰는 라이브러리다.
	wollewald/MPU9250_WE @ ^1.2.11
	; 화면(RAK1921 / SSD1306 128x64). RAK 공식 예제도 U8g2 를 쓴다.
	olikraus/U8g2 @ ^2.35.30

build_flags =
	-DCORE_DEBUG_LEVEL=1
	; RAK 배포 pins_arduino.h 가 이 폴더에 있다
	-Irakwireless/variants/rak3112
	-D_VARIANT_RAK3112_=1
