# XcodeGen 프로젝트 정의.
#   생성:  cd app && xcodegen generate
# .xcodeproj 는 이 파일에서 만들어지므로 직접 편집하지 말고 여기를 고칠 것.

name: SailingMonitor

options:
  bundleIdPrefix: kr.fetm
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top
  generateEmptyDirectories: true

# 서명 팀은 여기 한 곳만 채우면 두 타깃 모두에 적용된다.
# 예)  DEVELOPMENT_TEAM: ABCDE12345
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Team ID 는 인증서의 OU 필드 값이다 (CN 괄호 안 값이 아님).
    #   security find-certificate -c "Apple Development: <이름>" -p | openssl x509 -noout -subject
    DEVELOPMENT_TEAM: KC8YM8J64N   # FETM (Company)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:

  # ── iPhone 앱 ───────────────────────────────────────────────────────────
  SailingMonitor:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_NAME: SailingMonitor
        PRODUCT_BUNDLE_IDENTIFIER: kr.fetm.sailingmonitor
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # 워치 앱을 아이폰 앱 번들 안에 넣어 함께 설치되도록 한다.
      #
      # ★ 위치는 `$(CONTENTS_FOLDER_PATH)/Watch` 여야 한다 (dstSubfolderSpec 16).
      #
      #   PlugIns/ (dstSubfolderSpec 13) 로 옮겨본 적이 있는데
      #   (github.com/yonaskolb/XcodeGen/issues/1613 이 그렇게 하라고 한다)
      #   그러면 아이폰 Watch 앱의 "사용 가능한 앱" 목록에서 **아예 사라진다.**
      #   실기기(iOS 26.5 / watchOS 26.5)에서 양쪽 다 해보고 확인한 결과다.
      #   그 이슈는 빌드가 실패하는 경우에 대한 것이고 우리 구성에는 해당하지 않는다.
      - target: SailingMonitor Watch App
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    scheme:
      testTargets: []

  # ── Apple Watch 앱 (단일 타깃, 독립 실행) ───────────────────────────────
  SailingMonitor Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_NAME: SailingMonitor Watch App
        PRODUCT_BUNDLE_IDENTIFIER: kr.fetm.sailingmonitor.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/SailingMonitorWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        # 아이폰 앱 없이 워치 단독 설치 지원
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    scheme:
      testTargets: []

schemes:
  SailingMonitor:
    build:
      targets:
        SailingMonitor: all
    run:
      config: Debug
    archive:
      config: Release

  SailingMonitor Watch App:
    build:
      targets:
        SailingMonitor Watch App: all
    run:
      config: Debug
    archive:
      config: Release
